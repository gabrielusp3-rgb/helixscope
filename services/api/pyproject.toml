[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "helixscope-api"
version = "0.24.3.19"
description = "HelixScope FastAPI scientific backend (product version remains 0.24.3-19)."
requires-python = ">=3.12"
dependencies = [
    "helixscope-core==0.24.3.19",
    "fastapi==0.141.1",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.0,<3",
    "starlette>=0.46.0",
    "uvicorn[standard]>=0.32,<1",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.18,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["helixscope_api*"]
